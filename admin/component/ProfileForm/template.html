<form id="profile-form" class="movie-form">
  <h2>Ajouter un profil utilisateur</h2>

  <div class="form-group">
    <label for="name">Nom du profil *</label>
    <input type="text" id="name" name="name" required />
  </div>

  <div class="form-group">
    <label for="avatar">Nom du fichier avatar (facultatif)</label>
    <input type="text" id="avatar" name="avatar" placeholder="avatar.png" />
  </div>

  <div class="form-group">
    <label for="age">Restrictions d'âge *</label>
    <input type="number" id="age" name="age" min="0" max="18" required placeholder="0, 12, 16..." />
  </div>

  <button onclick="{{handler}}" type="button" class="btn-submit">Ajouter le profil</button>
</form>
