<!DOCTYPE html>
<html lang="fr">

<head>
  <title>SAE2.03 ADMIN</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./css/base.css" />
</head>

<body>
  <header id="header">
    <div id="menu-admin">
      <article class="logo"><a href="../index.html">Badflix</a></article>
      <div>
        <button onclick="V.renderMovieForm()">Ajouter un film</button>
        <button onclick="V.renderProfileForm()">Ajouter un profil</button>
      </div>
      <article class="navbar__admin" onclick="C.handlerAbout()">About</article>
    </div>
  </header>
  <section id="log"></section>
  <section id="form">

  </section>

  <script type="module">
    import { Log } from "./component/Log/script.js";
    import { MovieForm } from "./component/MovieForm/script.js";
    import { dataMovie } from "./data/dataMovie.js";
    import { ProfileForm } from "./component/ProfileForm/script.js";
    import { DataProfile } from "./data/dataProfile.js";

    


    window.C = {};

    C.handlerAjout = async function () {

      let form = document.querySelector('.movie-form');

      let fd = new FormData(form);

      let res = await dataMovie.addMovie(fd);

      V.renderLog(JSON.stringify(res));
    }

    C.handlerAddProfile = async function () {
      let form = document.querySelector("#profile-form");
      let formData = new FormData(form);

      let result = await DataProfile.add(formData);

      Log.print(result.message);
    }

    C.handlerAbout = function () {
      alert(
        "Ceci est un projet pour la SAE2.03 édition 2026."
      );
    };



    C.start = function () {
      V.renderLog("Démarrage de l'application");


    };

    window.V = {};

    V.renderLog = function (txt) {
      let content = document.querySelector("#log");
      content.innerHTML = Log.format(txt);
    };

    V.renderMovie = function (handler) {
      let content = document.querySelector('#addMovie');
      content.innerHTML = MovieForm.format(handler);
    };
    V.renderMovieForm = function () {
      let formulaire = document.querySelector("#form");
      formulaire.innerHTML = MovieForm.format("C.handlerAjout()");
    }
    V.renderProfileForm = function () {
      let formulaire = document.querySelector("#form");
      formulaire.innerHTML = ProfileForm.format("C.handlerAddProfile()");
    }


    C.start();
  </script>
</body>

</html>
