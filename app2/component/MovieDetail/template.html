<div class="detail">
  <div class="card__upper">
  <button class="btn-play">
      <div class="btn-play-container">
        <svg class="icon">
          <use xlink:href="#icon-play"></use>
        </svg>
        <span class="play"> Play </span>
      </div>
    </button>
    <div class="card-bookmark">
      <svg class="icon icon--bookmark">
        <use xlink:href="#icon-bookmark2"></use>
      </svg>
    </div>
  <div class="detail__image">
    <img src="../server/images/{{image}}" alt="Affiche de {{name}}">
  </div>
  </div>

  <div class="detail__content">
    <div class="detail__trailer">
      <iframe 
        src="{{trailer}}" 
        frameborder="0" 
        allowfullscreen>
      </iframe>
    </div>
    <h1 class="detail__title">{{name}}</h1>

    <p class="detail__description">{{description}}</p>

    <ul class="detail__info">
      <li><strong>Réalisateur :</strong> {{director}}</li>
      <li><strong>Année :</strong> {{year}}</li>
      <li><strong>Catégorie :</strong> {{id_category}}</li>
      <li><strong>Âge :</strong> {{min_age}}+</li>
    </ul>

    
  </div>
</div>
