<!DOCTYPE html>
<html lang="fr">
<head>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f5f5f5; /* gris très clair */
      color: #222; /* gris foncé */
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 2rem;
      font-weight: 500;
    }

    .btns {
      display: flex;
      gap: 2rem;
      justify-content: center;
    }

    .btn {
      padding: 1rem 2rem;
      font-size: 1.3rem;
      border-radius: 0.5rem;
      border: 1px solid #ccc;
      background: white;
      color: #222;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover {
      background: #e6e6e6;
      border-color: #bbb;
    }
  </style>
</head>

    <h1>Bienvenue</h1>

<a class="btn" href="./rapport-realtime.html" target="_blank">Stats en temps réel</a>
