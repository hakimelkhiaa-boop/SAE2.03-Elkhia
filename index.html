<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accueil – SAE 2.03</title>

  <style>
    :root {
      --bg: #000000;
      /* fond noir pur */
      --card-bg: #111;
      --text: #ffffff;
      --text-muted: #b3b7c5;
      --accent: #F5C518;
      /* jaune Pluto TV */
      --accent-hover: #ffdb4d;
      /* jaune plus clair au hover */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .container {
      text-align: center;
      max-width: 600px;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      color: var(--text-muted);
      margin-bottom: 2rem;
      font-size: 1rem;
    }

    .btns {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .btn {
      display: block;
      padding: 0.9rem 1.6rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: 0.2s ease-out;
      text-align: center;

      &&:hover {
        border-color: #F5C518;
        box-shadow: 0 0 22px rgb(245, 197, 24);
      }
    }

    .btn-primary {
      background: var(--accent);
      color: #000;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 12px 26px rgba(0, 0, 0, 0.7);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Bienvenue</h1>
    <p>Accédez rapidement aux différentes sections du site SAE 2.03.</p>

    <div class="btns">
      <a class="btn btn-primary" href="./app2/index.html">App version Pluto</a>
      <a class="btn btn-primary" href="./app/index.html">App</a>
      <a class="btn btn-ghost" href="./admin/index.html">Admin</a>
      <a class="btn btn-ghost" href="./rapport.html" target="_blank">Statistiques du site</a>
      <a class="btn btn-ghost" href="./rapport-realtime.html" target="_blank">Stats en temps réel</a>
    </div>
  </div>
</body>

</html>
